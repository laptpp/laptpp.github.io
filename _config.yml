# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: laptpp 的个人博客
subtitle: ''
description: ''
keywords:
author: laptpp
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://laptpp.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: Fluid

deploy:
  type: git
  repo: git@github.com:laptpp/laptpp.github.io.git
  branch: main

theme_config:
  navbar:
    blog_title: "laptpp 的个人博客"
  index:
    banner_img: /img/blog-banner.png
    slogan:
      enable: true
      text: "好好学习，天天向上"
  post:
    banner_img: /img/blog-banner.png
  archive:
    banner_img: /img/blog-banner.png
  category:
    banner_img: /img/blog-banner.png
  tag:
    banner_img: /img/blog-banner.png
  about:
    banner_img: /img/blog-banner.png
  page:
    banner_img: /img/blog-banner.png
  page404:
    banner_img: /img/blog-banner.png
  links:
    banner_img: /img/blog-banner.png
  dark_mode:
    enable: true
    default: light
  color:
    body_bg_color: "#f3f7fa"
    body_bg_color_dark: "#18212c"
    navbar_bg_color: "rgba(29, 45, 61, 0.78)"
    navbar_bg_color_dark: "#1b2836"
    navbar_text_color: "#f5f7fa"
    navbar_text_color_dark: "#e4eaf0"
    subtitle_color: "#ffffff"
    subtitle_color_dark: "#f5f7fa"
    text_color: "#34465a"
    text_color_dark: "#e0e6ed"
    sec_text_color: "#75869a"
    sec_text_color_dark: "#b0bac5"
    board_color: "#ffffff"
    board_color_dark: "#263442"
    post_text_color: "#34465a"
    post_text_color_dark: "#e0e6ed"
    post_heading_color: "#26384b"
    post_heading_color_dark: "#f0f3f6"
    post_link_color: "#527f9f"
    post_link_color_dark: "#91bad8"
    link_hover_color: "#8cb6ce"
    link_hover_color_dark: "#acd2e8"
    link_hover_bg_color: "#edf4f8"
    link_hover_bg_color_dark: "#34495b"
    line_color: "#e3eaf0"
    line_color_dark: "#435566"
    scrollbar_color: "#becbd6"
    scrollbar_color_dark: "#657888"
    scrollbar_hover_color: "#93a6b6"
    scrollbar_hover_color_dark: "#a5b5c2"
    button_bg_color: "transparent"
    button_bg_color_dark: "transparent"
    button_hover_bg_color: "#eaf1f5"
    button_hover_bg_color_dark: "#3c5367"
  favicon: /img/starry-favicon.jpg
  apple_touch_icon: /img/starry-favicon.jpg
